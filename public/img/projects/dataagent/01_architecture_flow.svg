<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <linearGradient id="card-grad-agent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="shadow-agent" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrow-agent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg-grad-agent)"/>

  <!-- Matrix Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.35">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="680"/>
    <line x1="400" y1="0" x2="400" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="800" y1="0" x2="800" y2="680"/>
    <line x1="1000" y1="0" x2="1000" y2="680"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="190" height="28" rx="14" fill="#6d28d9" fill-opacity="0.3" stroke="#a855f7" stroke-width="1"/>
    <text x="95" y="18" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">MULTI-AGENT MESH</text>
    
    <text x="0" y="62" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">Enterprise Data Agent Intelligence Mesh</text>
    <text x="0" y="86" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">Hierarchical Supervisor Router, Guardrailed SQL Analyst, Autonomous ETL Subgraph &amp; PostgreSQL Engine</text>
  </g>

  <!-- 1. Supervisor Router -->
  <g transform="translate(60, 170)" filter="url(#shadow-agent)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-agent)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-purple)"/>
    <text x="24" y="38" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">1. SUPERVISOR</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Intent Routing</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">User Natural Query</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">FastAPI / CLI / Slack</text>
      <text x="16" y="66" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11">Complex Analytic Intent</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Router Classifier</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Pydantic RouterSchema</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Branch: SQL vs ETL</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">State Persistence</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Conversation Checkpoint</text>
      <text x="16" y="66" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Postgres MemorySaver</text>
    </g>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 290 380 L 340 380" stroke="#c084fc" stroke-width="2.5" fill="none" marker-end="url(#arrow-agent)" stroke-dasharray="4 4"/>

  <!-- 2. SQL Analyst Subgraph -->
  <g transform="translate(345, 170)" filter="url(#shadow-agent)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-agent)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-cyan)"/>
    <text x="24" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">2. SQL SUBGRAPH</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Guardrailed SQL</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Schema Introspect</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Dynamic DDL &amp; Samples</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">5 Live Catalog Tables</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Security Judge</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Enforce Read-Only SELECT</text>
      <text x="16" y="66" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">Blocks DROP/DELETE/INSERT</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Query Execution</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">PostgreSQL Driver</text>
      <text x="16" y="66" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Auto-Limit 100 Rows</text>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 575 380 L 625 380" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow-agent)" stroke-dasharray="4 4"/>

  <!-- 3. ETL Analyst Subgraph -->
  <g transform="translate(630, 170)" filter="url(#shadow-agent)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-agent)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-emerald)"/>
    <text x="24" y="38" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">3. ETL SUBGRAPH</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Autonomous ReAct</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Extract &amp; Load Tool</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">APIs, Webhooks &amp; CSV</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Dynamic Ingestion</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Transform Tool</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Pandas &amp; Polars Vector</text>
      <text x="16" y="66" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">Column Cleanse &amp; Format</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Code Execution Env</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Sandboxed Python Tool</text>
      <text x="16" y="66" fill="#a855f7" font-family="-apple-system, sans-serif" font-size="11">Zero Side-Effects</text>
    </g>
  </g>

  <!-- Flow 3 -> 4 -->
  <path d="M 860 380 L 910 380" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow-agent)" stroke-dasharray="4 4"/>

  <!-- 4. Production Serving & DB -->
  <g transform="translate(915, 170)" filter="url(#shadow-agent)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-agent)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-purple)"/>
    <text x="24" y="38" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">4. PRODUCTION OPS</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Serving &amp; DB</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">FastAPI &amp; Streamlit</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Interactive BI Chat UI</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Visual DAG Viewer</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">PostgreSQL (:5432)</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Seed Init Data &amp; Relations</text>
      <text x="16" y="66" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">Users, Rides, Payments</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">One-Click Deploy</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">bootstrap.sh | deploy.sh</text>
      <text x="16" y="66" fill="#c084fc" font-family="-apple-system, sans-serif" font-size="11">Zero-Cost Teardown ($0)</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(60, 620)">
    <text x="0" y="20" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Single-Command Cloud Bootstrap: curl -fsSL https://raw.githubusercontent.com/KishorKumarParoi/Data-Agent/main/bootstrap.sh | bash</text>
    <text x="1080" y="20" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" text-anchor="end" font-weight="600">✓ $0.00 Teardown Verified (clear.sh)</text>
  </g>
</svg>
