<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="inferenceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="modelStoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="obsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="gitopsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="650" fill="url(#bgGrad)"/>
  <rect x="15" y="15" width="1170" height="620" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Real-Time MLOps: Sub-50ms Churn Prediction &amp; Serving Lifecycle</text>
  <text x="40" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">High-Throughput Feature Pipeline, DVC Model Registry, Automated Drift Auditing, and GitOps Continuous Delivery</text>

  <!-- Section 1: Client / Ingestion Tier -->
  <rect x="40" y="120" width="220" height="470" rx="10" fill="url(#clientGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="155" fill="#38bdf8" font-family="sans-serif" font-size="15" font-weight="700">1. CONSUMER TIER</text>
  
  <rect x="55" y="175" width="190" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="70" y="200" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Web / Mobile Apps</text>
  <text x="70" y="220" fill="#94a3b8" font-family="sans-serif" font-size="11">Customer Account Portal</text>
  <text x="70" y="238" fill="#10b981" font-family="sans-serif" font-size="11">HTTPS REST / JSON</text>

  <rect x="55" y="275" width="190" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="70" y="300" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">CRM / Support Desk</text>
  <text x="70" y="320" fill="#94a3b8" font-family="sans-serif" font-size="11">Call Center Retention Queue</text>
  <text x="70" y="338" fill="#38bdf8" font-family="sans-serif" font-size="11">Interactive Lookups</text>

  <rect x="55" y="375" width="190" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="70" y="400" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Event Stream Ingest</text>
  <text x="70" y="420" fill="#94a3b8" font-family="sans-serif" font-size="11">Kafka / EventBridge</text>
  <text x="70" y="438" fill="#f59e0b" font-family="sans-serif" font-size="11">Streaming User Activity</text>

  <rect x="55" y="475" width="190" height="95" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="70" y="500" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Service SLA</text>
  <text x="70" y="520" fill="#94a3b8" font-family="sans-serif" font-size="11">p95 Latency: &lt; 35ms</text>
  <text x="70" y="538" fill="#94a3b8" font-family="sans-serif" font-size="11">p99 Latency: &lt; 60ms</text>
  <text x="70" y="556" fill="#10b981" font-family="sans-serif" font-size="11">Availability: 99.95%</text>

  <!-- Section 2: Serving Gateway & Feature Processing -->
  <rect x="300" y="120" width="280" height="470" rx="10" fill="url(#gatewayGrad)" stroke="#059669" stroke-width="1.5"/>
  <text x="320" y="155" fill="#a7f3d0" font-family="sans-serif" font-size="15" font-weight="700">2. SERVING RUNTIME (FASTAPI)</text>

  <rect x="315" y="175" width="250" height="90" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="330" y="200" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Request Validation Tier</text>
  <text x="330" y="220" fill="#a7f3d0" font-family="sans-serif" font-size="11">Pydantic v2 CustomerData Schema</text>
  <text x="330" y="238" fill="#94a3b8" font-family="sans-serif" font-size="11">Range bounds, typing, sanitization</text>
  <text x="330" y="254" fill="#38bdf8" font-family="sans-serif" font-size="11">Fast serialization (&lt; 2ms)</text>

  <rect x="315" y="280" width="250" height="90" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="330" y="305" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Feature Engineering Pipeline</text>
  <text x="330" y="325" fill="#a7f3d0" font-family="sans-serif" font-size="11">5 Core Telecommunication Features:</text>
  <text x="330" y="343" fill="#94a3b8" font-family="sans-serif" font-size="11">• age, tenure_months, monthly_charges</text>
  <text x="330" y="359" fill="#94a3b8" font-family="sans-serif" font-size="11">• total_charges, num_support_calls</text>

  <rect x="315" y="385" width="250" height="95" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="330" y="410" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">In-Memory Model Evaluator</text>
  <text x="330" y="430" fill="#a7f3d0" font-family="sans-serif" font-size="11">Scikit-Learn Random Forest</text>
  <text x="330" y="448" fill="#94a3b8" font-family="sans-serif" font-size="11">100 Estimators | Sub-15ms Eval</text>
  <text x="330" y="466" fill="#10b981" font-family="sans-serif" font-size="11">Binary Decision &amp; Probability Score</text>

  <rect x="315" y="495" width="250" height="75" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="330" y="520" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Dynamic Risk Tiering</text>
  <text x="330" y="540" fill="#ef4444" font-family="sans-serif" font-size="11">HIGH (&gt;0.6) </text>
  <text x="400" y="540" fill="#f59e0b" font-family="sans-serif" font-size="11">| MEDIUM (0.3-0.6) </text>
  <text x="510" y="540" fill="#10b981" font-family="sans-serif" font-size="11">| LOW</text>
  <text x="330" y="558" fill="#94a3b8" font-family="sans-serif" font-size="11">Returns JSON with recommended action</text>

  <!-- Section 3: Model Registry & DVC Store -->
  <rect x="620" y="120" width="260" height="470" rx="10" fill="url(#modelStoreGrad)" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="640" y="155" fill="#e9d5ff" font-family="sans-serif" font-size="15" font-weight="700">3. MODEL STORE &amp; GOVERNANCE</text>

  <rect x="635" y="175" width="230" height="90" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
  <text x="650" y="200" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">DVC Model Versioning</text>
  <text x="650" y="220" fill="#d8b4fe" font-family="sans-serif" font-size="11">models/churn_model.pkl.dvc</text>
  <text x="650" y="238" fill="#94a3b8" font-family="sans-serif" font-size="11">SHA256 Pointer to Remote S3</text>
  <text x="650" y="254" fill="#10b981" font-family="sans-serif" font-size="11">Reproducible Checkpointing</text>

  <rect x="635" y="280" width="230" height="90" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
  <text x="650" y="305" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Automated Retraining</text>
  <text x="650" y="325" fill="#d8b4fe" font-family="sans-serif" font-size="11">Continuous Training Trigger</text>
  <text x="650" y="343" fill="#94a3b8" font-family="sans-serif" font-size="11">80/20 Stratified Validation Split</text>
  <text x="650" y="359" fill="#38bdf8" font-family="sans-serif" font-size="11">AUC-ROC &amp; Accuracy Gates</text>

  <rect x="635" y="385" width="230" height="95" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
  <text x="650" y="410" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Artifact Storage (S3 / MinIO)</text>
  <text x="650" y="430" fill="#d8b4fe" font-family="sans-serif" font-size="11">s3://mlops-artifacts/models/</text>
  <text x="650" y="448" fill="#94a3b8" font-family="sans-serif" font-size="11">KMS Server-Side Encryption</text>
  <text x="650" y="466" fill="#f59e0b" font-family="sans-serif" font-size="11">Immutable Checkpoint Hashes</text>

  <rect x="635" y="495" width="230" height="75" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
  <text x="650" y="520" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">GitOps Delivery (ArgoCD)</text>
  <text x="650" y="540" fill="#d8b4fe" font-family="sans-serif" font-size="11">k8s/ Deployment &amp; Service</text>
  <text x="650" y="558" fill="#10b981" font-family="sans-serif" font-size="11">Zero-Downtime Rolling Update</text>

  <!-- Section 4: Observability & Drift Detection -->
  <rect x="920" y="120" width="240" height="470" rx="10" fill="url(#obsGrad)" stroke="#ea580c" stroke-width="1.5"/>
  <text x="935" y="155" fill="#fed7aa" font-family="sans-serif" font-size="15" font-weight="700">4. OBSERVABILITY &amp; DRIFT</text>

  <rect x="935" y="175" width="210" height="90" rx="8" fill="#431407" stroke="#f97316" stroke-width="1"/>
  <text x="950" y="200" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Prometheus Telemetry</text>
  <text x="950" y="220" fill="#fed7aa" font-family="sans-serif" font-size="11">Scraping /metrics @ 5s</text>
  <text x="950" y="238" fill="#94a3b8" font-family="sans-serif" font-size="11">p50, p95, p99 Latency</text>
  <text x="950" y="254" fill="#38bdf8" font-family="sans-serif" font-size="11">Throughput RPS &amp; Errors</text>

  <rect x="935" y="280" width="210" height="90" rx="8" fill="#431407" stroke="#f97316" stroke-width="1"/>
  <text x="950" y="305" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Concept Drift Detection</text>
  <text x="950" y="325" fill="#fed7aa" font-family="sans-serif" font-size="11">Kolmogorov-Smirnov Test</text>
  <text x="950" y="343" fill="#94a3b8" font-family="sans-serif" font-size="11">Drift Threshold &gt; 0.05</text>
  <text x="950" y="359" fill="#ef4444" font-family="sans-serif" font-size="11">Auto-Triggers Pipeline Retrain</text>

  <rect x="935" y="385" width="210" height="95" rx="8" fill="#431407" stroke="#f97316" stroke-width="1"/>
  <text x="950" y="410" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Grafana Executive Dash</text>
  <text x="950" y="430" fill="#fed7aa" font-family="sans-serif" font-size="11">Real-time Churn Heatmap</text>
  <text x="950" y="448" fill="#94a3b8" font-family="sans-serif" font-size="11">Confidence Score Distribution</text>
  <text x="950" y="466" fill="#10b981" font-family="sans-serif" font-size="11">SLO Error Budget Burn Rate</text>

  <rect x="935" y="495" width="210" height="75" rx="8" fill="#431407" stroke="#f97316" stroke-width="1"/>
  <text x="950" y="520" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Zero-Cost Teardown</text>
  <text x="950" y="540" fill="#fed7aa" font-family="sans-serif" font-size="11">./clear.sh &amp; Resource Purge</text>
  <text x="950" y="558" fill="#10b981" font-family="sans-serif" font-size="11">$0.00 Active Idle Footprint</text>

  <!-- Connective Arrows -->
  <path d="M 260 215 L 315 215" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 580 220 L 635 220" stroke="#c084fc" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/>
  <path d="M 580 430 L 635 430" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 880 220 L 935 220" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M 880 325 L 935 325" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>

</svg>
