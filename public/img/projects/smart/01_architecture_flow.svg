<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-smart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d182e"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="card-grad-smart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="accent-rust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="accent-cyan-smart" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accent-emerald-smart" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <filter id="shadow-smart" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrow-smart" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bg-grad-smart)"/>

  <!-- Matrix Grid -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.35">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="680"/>
    <line x1="400" y1="0" x2="400" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="800" y1="0" x2="800" y2="680"/>
    <line x1="1000" y1="0" x2="1000" y2="680"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="190" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="95" y="18" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1.5">INDUSTRIAL IOT / MLOPS</text>
    
    <text x="0" y="62" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="28" font-weight="800">Smart Manufacturing Industry 4.0 Platform</text>
    <text x="0" y="86" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="14">Edge Ingestion (Rust), High-Throughput Telemetry (Go), PyTorch Autoencoders &amp; Kubernetes Active-Passive Failover</text>
  </g>

  <!-- 1. Edge & IoT Ingestion -->
  <g transform="translate(60, 170)" filter="url(#shadow-smart)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-smart)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-rust)"/>
    <text x="24" y="38" fill="#fb923c" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">1. EDGE INGESTION</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Rust &amp; Go Edge</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Rust Edge Ingester</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">OPC-UA / MQTT Protocols</text>
      <text x="16" y="66" fill="#ea580c" font-family="-apple-system, sans-serif" font-size="11">Zero Memory Safety Overhead</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Go Telemetry Gateway</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Goroutine Concurrency</text>
      <text x="16" y="66" fill="#00add8" font-family="-apple-system, sans-serif" font-size="11">100K+ Events/sec Pipeline</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Redis In-Memory Bus</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Pub/Sub Message Stream</text>
      <text x="16" y="66" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">Sub-Millisecond Buffering</text>
    </g>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M 290 380 L 340 380" stroke="#fb923c" stroke-width="2.5" fill="none" marker-end="url(#arrow-smart)" stroke-dasharray="4 4"/>

  <!-- 2. AI Anomaly & Defect Models -->
  <g transform="translate(345, 170)" filter="url(#shadow-smart)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-smart)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-emerald-smart)"/>
    <text x="24" y="38" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">2. INDUSTRIAL AI</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">PyTorch Models</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Sensor Autoencoder</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Reconstruction Error Loss</text>
      <text x="16" y="66" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">Early Anomaly Warning</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Defect Classifier</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Visual Inspection CNN</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Precision: 99.2% Defect Catch</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">MLflow Model Registry</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Continuous Evaluation</text>
      <text x="16" y="66" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11">Artifact Checkpointing</text>
    </g>
  </g>

  <!-- Flow 2 -> 3 -->
  <path d="M 575 380 L 625 380" stroke="#34d399" stroke-width="2.5" fill="none" marker-end="url(#arrow-smart)" stroke-dasharray="4 4"/>

  <!-- 3. GitOps & Kubeflow Pipeline -->
  <g transform="translate(630, 170)" filter="url(#shadow-smart)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-smart)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-cyan-smart)"/>
    <text x="24" y="38" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">3. MLOPS PIPELINE</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Kubeflow &amp; CI/CD</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Kubeflow Pipeline</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Katib Hyperparameter Tune</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Automated DAG Steps</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">12-Stage Jenkins CI</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Lint, SAST, Unit, E2E</text>
      <text x="16" y="66" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">Multi-Architecture Build</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">ArgoCD GitOps</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Declarative Sync</text>
      <text x="16" y="66" fill="#ea580c" font-family="-apple-system, sans-serif" font-size="11">Zero Drift Cluster Deployment</text>
    </g>
  </g>

  <!-- Flow 3 -> 4 -->
  <path d="M 860 380 L 910 380" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrow-smart)" stroke-dasharray="4 4"/>

  <!-- 4. Multi-Cloud Failover & K8s -->
  <g transform="translate(915, 170)" filter="url(#shadow-smart)">
    <rect width="230" height="420" rx="16" fill="url(#card-grad-smart)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="230" height="6" rx="3" fill="url(#accent-emerald-smart)"/>
    <text x="24" y="38" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">4. RESILIENT INFRA</text>
    <text x="24" y="65" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="18" font-weight="700">Active-Passive</text>

    <g transform="translate(20, 90)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Primary: GKE Cluster</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">NVIDIA T4 GPU Acceleration</text>
      <text x="16" y="66" fill="#34d399" font-family="-apple-system, sans-serif" font-size="11">Active Inference Gateway</text>
    </g>

    <g transform="translate(20, 195)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">Secondary: AWS EKS</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Warm Standby Failover</text>
      <text x="16" y="66" fill="#f59e0b" font-family="-apple-system, sans-serif" font-size="11">RTO &lt; 30s | RPO &lt; 5s</text>
    </g>

    <g transform="translate(20, 300)">
      <rect width="190" height="85" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, sans-serif" font-size="14" font-weight="600">One-Click Deploy</text>
      <text x="16" y="48" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">bootstrap.sh | deploy.sh</text>
      <text x="16" y="66" fill="#38bdf8" font-family="-apple-system, sans-serif" font-size="11">Zero-Cost Teardown ($0)</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(60, 620)">
    <text x="0" y="20" fill="#64748b" font-family="-apple-system, sans-serif" font-size="12">Single-Command Cloud Bootstrap: curl -fsSL https://raw.githubusercontent.com/KishorKumarParoi/smart-manufacturing/main/bootstrap.sh | bash</text>
    <text x="1080" y="20" fill="#34d399" font-family="-apple-system, sans-serif" font-size="12" text-anchor="end" font-weight="600">✓ $0.00 Teardown Verified (clear.sh)</text>
  </g>
</svg>
